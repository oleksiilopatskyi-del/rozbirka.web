capabilities:
  - id: auth.welcome.view
    domain: auth
    name: View the authentication entry screen and legal links
    mobile:
      routes:
        - /(auth)/welcome
      actions:
        - Open phone authentication
        - Open terms of use
        - Open privacy policy
    web:
      outcome: Start authentication and open the applicable legal documents
      route: /login
      disposition: browser-native
      browserEquivalent: Use standard Web links for legal documents and a stable login URL
    contract:
      service: none
      status: not-applicable
    access:
      permissions:
        - anonymous
      tenant: not-applicable
      billing: not-applicable
    owner: web
    tracking:
      status: existing
      issue: ROZ-104
    evidence:
      - rozbirka.mobile:app/(auth)/welcome.tsx
      - rozbirka.web:src/routes/routes.tsx

  - id: auth.otp.request
    domain: auth
    name: Request a phone OTP
    mobile:
      routes:
        - /(auth)/login
      actions:
        - Enter a Ukrainian phone number
        - Request an OTP
        - Resend an OTP after cooldown
    web:
      outcome: Request and safely resend a phone OTP with clear rate-limit errors
      route: /login
      disposition: parity
    contract:
      service: identity
      status: partial
      operations:
        - POST /auth/phone
      notes: Runtime endpoint exists, but immutable Identity OpenAPI and OTP hardening are pending under ROZ-124 and ROZ-125
    access:
      permissions:
        - anonymous
      tenant: not-applicable
      billing: not-applicable
    owner: identity
    tracking:
      status: existing
      issue: ROZ-125
    evidence:
      - rozbirka.mobile:app/(auth)/login.tsx
      - rozbirka.mobile:src/api/auth.ts
      - rozbirka.identity:src/Rozbirka.Identity.API/Controllers/AuthController.cs

  - id: auth.otp.verify
    domain: auth
    name: Verify a phone OTP and establish a session
    mobile:
      routes:
        - /(auth)/login
      actions:
        - Enter a six-digit OTP
        - Verify the OTP
        - Continue to name, tenant onboarding, or the dashboard
    web:
      outcome: Verify the OTP, establish the authenticated session, and resume the correct onboarding destination
      route: /login
      disposition: parity
    contract:
      service: identity
      status: partial
      operations:
        - POST /auth/verify
      notes: Runtime endpoint exists, but immutable Identity OpenAPI, production OTP guarantees, and negative-path coverage are pending under ROZ-124 and ROZ-125
    access:
      permissions:
        - anonymous
      tenant: not-applicable
      billing: not-applicable
    owner: identity
    tracking:
      status: existing
      issue: ROZ-125
    evidence:
      - rozbirka.mobile:app/(auth)/login.tsx
      - rozbirka.mobile:src/api/auth.ts
      - rozbirka.identity:src/Rozbirka.Identity.API/Controllers/AuthController.cs

  - id: auth.profile-name.set
    domain: auth
    name: Set the authenticated user display name
    mobile:
