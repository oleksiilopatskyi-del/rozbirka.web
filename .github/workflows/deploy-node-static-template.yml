name: Deploy Node Static Template

on:
  workflow_call:
    inputs:
      project_name:
        description: Display name for the app being deployed
        required: true
        type: string
      branch:
        description: Branch to build
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: string
      enable_deployment:
        description: Deploy after building
        required: true
        type: boolean
      auto_qa_deploy:
        description: True when this was triggered by develop push
        required: true
        type: boolean
      run_build:
        description: Run npm build before deployment
        required: true
        type: boolean
    secrets:
      CLOUDFLARE_TOKEN:
        description: Cloudflare API token with Workers deploy permissions
        required: true
      CF_ACCESS_CLIENT_ID:
        description: Cloudflare Access service-token client ID for QA checks
        required: false
      CF_ACCESS_CLIENT_SECRET:
        description: Cloudflare Access service-token secret for QA checks
        required: false

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build ${{ inputs.project_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - if: inputs.run_build
        run: npx playwright install --with-deps chromium firefox webkit

      - if: inputs.run_build
        run: |
          env_name="${{ inputs.auto_qa_deploy && 'qa' || inputs.environment }}"
          if [ "$env_name" = "prod" ]; then
            npm run verify:prod
          else
            npm run check
            npm run build:qa
            npm run budget:assets
            npm run test:e2e
            npx wrangler deploy --dry-run --env qa
          fi

      - if: failure() && inputs.run_build
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            test-results
            e2e/**/*-snapshots/*-linux-*.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

  deploy:
    needs: build
    if: inputs.enable_deployment
    name: Deploy ${{ inputs.project_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.auto_qa_deploy && 'qa' || inputs.environment }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: |
          env_name="${{ inputs.auto_qa_deploy && 'qa' || inputs.environment }}"
          if [ "$env_name" = "prod" ]; then
            wrangler_env="production"
          else
            wrangler_env="qa"
          fi

          npm ci
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN GitHub secret is missing or empty."
            exit 1
          fi

          if [ "$wrangler_env" = "production" ]; then
            npm run check:routes -- https://qa.rozbirka.pro https://qaapi.rozbirka.pro
          fi

          npx wrangler deploy --env "$wrangler_env"

          if [ "$wrangler_env" = "production" ]; then
            npm run check:routes -- https://rozbirka.pro https://api.rozbirka.pro
          else
            npm run check:routes -- https://qa.rozbirka.pro https://qaapi.rozbirka.pro
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
