name: Deploy Node Static Template

on:
  workflow_call:
    inputs:
      project_name:
        description: Display name for the app being deployed
        required: true
        type: string
      branch:
        description: Branch to build
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: string
      enable_deployment:
        description: Deploy after building
        required: true
        type: boolean
      auto_qa_deploy:
        description: True when this was triggered by develop push
        required: true
        type: boolean
      run_build:
        description: Run npm build before deployment
        required: true
        type: boolean

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build ${{ inputs.project_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - if: inputs.run_build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

  deploy:
    needs: build
    if: inputs.enable_deployment
    name: Deploy ${{ inputs.project_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.auto_qa_deploy && 'qa' || inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: |
          env_name="${{ inputs.auto_qa_deploy && 'qa' || inputs.environment }}"
          gcloud storage rsync dist "gs://rozbirka-web-$env_name" \
            --recursive \
            --delete-unmatched-destination-objects \
            --project="rozbirka-$env_name"
