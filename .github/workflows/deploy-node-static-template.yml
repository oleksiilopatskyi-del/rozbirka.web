name: Deploy Node Static Template

on:
  workflow_call:
    inputs:
      project_name:
        description: Display name for the app being deployed
        required: true
        type: string
      branch:
        description: Branch to build
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: string
      enable_deployment:
        description: Deploy after building
        required: true
        type: boolean
      auto_qa_deploy:
        description: True when this was triggered by develop push
        required: true
        type: boolean
      run_build:
        description: Run npm build before deployment
        required: true
        type: boolean

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build ${{ inputs.project_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - if: inputs.run_build
        run: |
          env_name="${{ inputs.auto_qa_deploy && 'qa' || inputs.environment }}"
          if [ "$env_name" = "prod" ]; then
            npm run build:prod
          else
            npm run build:qa
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

  deploy:
    needs: build
    if: inputs.enable_deployment
    name: Deploy ${{ inputs.project_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.auto_qa_deploy && 'qa' || inputs.environment }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: |
          env_name="${{ inputs.auto_qa_deploy && 'qa' || inputs.environment }}"
          if [ "$env_name" = "prod" ]; then
            wrangler_env="production"
          else
            wrangler_env="qa"
          fi

          npm ci
          npx wrangler deploy --env "$wrangler_env"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
