name: deploy

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and optionally deploy
        required: true
        type: string
        default: develop
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - qa
          - prod
      deploy:
        description: Deploy after building
        required: true
        type: boolean
        default: true

env:
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

  deploy-qa:
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment: qa
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: |
          gcloud storage rsync dist gs://rozbirka-web-qa \
            --recursive \
            --delete-unmatched-destination-objects \
            --project=rozbirka-qa

  deploy-manual:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: |
          env_name="${{ inputs.environment }}"
          gcloud storage rsync dist "gs://rozbirka-web-$env_name" \
            --recursive \
            --delete-unmatched-destination-objects \
            --project="rozbirka-$env_name"
